
      - name: Build APK
        shell: bash
        run: buildozer android debug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: tail -n 60 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
          if-no-files-found: error
